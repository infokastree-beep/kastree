# Remind contributors that Railway deploys from GitHub, not Cursor origin.
# Full two-remote sync check (origin vs github) runs in scripts/verify_remotes_in_sync.sh
# locally or in Cloud Agent sessions where both remotes exist.
#
# Production frontend SHA is guarded separately by verify-production-frontend.yml
# (fails the push if www.kastree.ie does not serve github.sha).
name: Deploy source reminder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Railway deploys this commit SHA
        run: |
          echo "GitHub main SHA: ${{ github.sha }}"
          echo "Railway auto-deploys from infokastree-beep/kastree on this push."
          echo "Cloud Agent sessions must also run: git push github main"
          echo "Then verify: ./scripts/verify_remotes_in_sync.sh"
          echo "Frontend live-SHA guard: verify-production-frontend.yml"
