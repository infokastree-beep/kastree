# Superseded by verify-production-frontend.yml, which optionally POSTs the same
# deploy hook and then polls www.kastree.ie until the pushed SHA is live.
# Kept as a no-op reminder so existing workflow badges/docs do not 404.
name: Vercel production deploy hook

on:
  workflow_dispatch:

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Point to the SHA guard workflow
        run: |
          echo "This workflow is superseded by .github/workflows/verify-production-frontend.yml"
          echo "That workflow triggers the deploy hook (if VERCEL_DEPLOY_HOOK_URL is set)"
          echo "and fails the push if www.kastree.ie does not serve the commit SHA."
