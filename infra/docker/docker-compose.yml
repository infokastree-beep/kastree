services:
  postgres:
    image: postgres:15
    container_name: findraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: findraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: findraft_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findraft -d findraft_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
